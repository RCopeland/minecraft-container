services:
  # --- The Bodyguard (Tailscale) ---
  # Joins the tailnet as "minecraft". No tailscale serve config is provided
  # because this stack is pure UDP — Bedrock speaks RakNet over UDP 19132,
  # which Tailscale carries natively inside the tailnet. HTTPS certificates
  # and funnel are irrelevant here, so TS_SERVE_CONFIG and TS_CERT_DOMAIN are
  # intentionally omitted.
  #
  # This sidecar also applies the iOS MTU fix (see sidecar-entrypoint.sh): it
  # owns the shared netns and is the only image in this stack that ships `ip`.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: minecraft-tailscale
    hostname: minecraft
    entrypoint: ["/bin/sh", "/sidecar-entrypoint.sh"]
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # iOS RakNet MTU discovery fix (see sidecar-entrypoint.sh).
      - MTU_INTERFACE=${MTU_INTERFACE:-eth0}
      - MTU_VALUE=${MTU_VALUE:-1280}
    volumes:
      - tailscale_data:/var/lib/tailscale
      - ./sidecar-entrypoint.sh:/sidecar-entrypoint.sh:ro
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  # --- The App (Bedrock) ---
  # Shares the tailscale container's network namespace, so it is ONLY reachable
  # over the tailnet (via the 100.x.y.z tailnet IP or the MagicDNS hostname).
  # No host ports are published, so nothing is exposed on the LAN or internet.
  bedrock:
    image: itzg/minecraft-bedrock-server:latest
    container_name: minecraft-bedrock
    network_mode: service:tailscale
    restart: unless-stopped
    # Keep graceful-shutdown defaults (see entrypoint.sh). The iOS MTU fix is
    # applied by the tailscale sidecar, which owns this container's netns.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - EULA=${EULA}
      - SERVER_NAME=${SERVER_NAME}
      - GAMEMODE=${GAMEMODE}
      - DIFFICULTY=${DIFFICULTY}
      - ALLOW_CHEATS=${ALLOW_CHEATS}
      - ONLINE_MODE=${ONLINE_MODE}
      # The Bedrock image defaults allow-list=true with an empty list, which
      # locks everyone out. No allowlist is wanted here (Xbox Live auth via
      # ONLINE_MODE is the access control), so it is disabled explicitly to
      # survive a fresh /data volume.
      - ALLOW_LIST=${ALLOW_LIST:-false}
      - TZ=${TZ:-America/New_York}
    volumes:
      - minecraft_data:/data
      - ./entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - tailscale

volumes:
  tailscale_data:
  minecraft_data:
