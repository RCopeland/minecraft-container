services:
  # --- The App (Bedrock) ---
  #
  # Runs on the HOST network, not behind the tailscale sidecar. This is
  # deliberate and load-bearing:
  #
  #   * Bedrock speaks RakNet over UDP 19132. Tailscale's `serve` is TCP/HTTP
  #     only, so there is no proxy path for it.
  #   * This homelab has no /dev/net/tun, so every container runs
  #     tun=userspace-networking. That mode forwards inbound tailnet traffic to
  #     localhost *within the sidecar's own process tree*. A UDP socket owned by
  #     a different container is not reachable that way -- verified by test:
  #     the sidecar could receive tailnet UDP on any port, the app container
  #     never could.
  #
  # On the host network the server binds the host's regular interfaces, so any
  # device on the home LAN reaches it directly at <host-lan-ip>:19132. That is
  # the intended access path: the kids' iPads are on the home wifi and do not
  # need Tailscale at all.
  #
  # If remote access is ever wanted, the correct fix is a real TUN device
  # (/dev/net/tun) on the host so Tailscale leaves userspace mode -- not a
  # published port and not a funnel.
  bedrock:
    image: itzg/minecraft-bedrock-server:latest
    container_name: minecraft-bedrock
    network_mode: host
    restart: unless-stopped
    # Keep graceful-shutdown defaults (see entrypoint.sh).
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - EULA=${EULA}
      - SERVER_NAME=${SERVER_NAME}
      - GAMEMODE=${GAMEMODE}
      - DIFFICULTY=${DIFFICULTY}
      - ALLOW_CHEATS=${ALLOW_CHEATS}
      - ONLINE_MODE=${ONLINE_MODE}
      # MUST stay raknet. Bedrock 1.26.50+ defaults to transport=nethernet,
      # which is a known Mojang regression (BDS-23108): the server logs
      # "Accepting clients on 19132" but never opens the UDP socket, and every
      # client times out. Set explicitly so a fresh /data volume cannot
      # reintroduce the broken default.
      - TRANSPORT=${TRANSPORT:-raknet}
      # The Bedrock image defaults allow-list=true with an empty list, which
      # locks everyone out. Access control comes from ONLINE_MODE instead.
      - ALLOW_LIST=${ALLOW_LIST:-false}
      - TZ=${TZ:-America/New_York}
    volumes:
      - minecraft_data:/data
      - ./entrypoint.sh:/entrypoint.sh:ro

volumes:
  minecraft_data:
